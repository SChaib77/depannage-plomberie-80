<svg width="280" height="64" viewBox="0 0 280 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dépannage Plomberie 80">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#0a3d62"/>
    </linearGradient>
  </defs>
  <!-- Mark: water droplet holding a wrench -->
  <g transform="translate(4,4)">
    <path d="M28 2 C28 2 50 26 50 40 a22 22 0 0 1 -44 0 C6 26 28 2 28 2 Z" fill="url(#drop)"/>
    <!-- wrench, white -->
    <path d="M37.5 24.8 a7.6 7.6 0 0 0 -9.9 9.1 L17.4 44.1 a3.2 3.2 0 0 0 4.5 4.5 L32.1 38.4 a7.6 7.6 0 0 0 9.1 -9.9 l-4.6 4.6 -4.2 -1.1 -1.1 -4.2 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round"/>
    <!-- shine -->
    <ellipse cx="20" cy="22" rx="4.4" ry="6.2" fill="#ffffff" opacity="0.28"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Poppins, 'Segoe UI', sans-serif">
    <text x="70" y="30" font-size="21" font-weight="700" fill="#0a3d62" letter-spacing="-0.3">Dépannage</text>
    <text x="70" y="52" font-size="21" font-weight="700" fill="#1e88e5" letter-spacing="-0.3">Plomberie <tspan fill="#ff7a18">80</tspan></text>
  </g>
</svg>
